<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091811"/>
      <stop offset="50%" stop-color="#0e241b"/>
      <stop offset="100%" stop-color="#07140e"/>
    </linearGradient>
    <linearGradient id="bathWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="brickColor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg2)"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="880" height="64" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="65" y="65" fill="#38bdf8" font-size="26" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">💧 THE GREAT BATH &amp; URBAN TOWN PLANNING</text>
  <text x="660" y="64" fill="#94a3b8" font-size="16" font-family="system-ui, -apple-system, sans-serif">Mohenjo-daro Architecture</text>

  <!-- Left Side: Diagram of the Great Bath Structure -->
  <rect x="40" y="105" width="560" height="465" rx="20" fill="#0b1e16" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Brick Citadel Platform -->
  <rect x="70" y="140" width="500" height="270" rx="12" fill="url(#brickColor)" stroke="#f97316" stroke-width="2"/>
  
  <!-- Outer Paved Walkway -->
  <rect x="90" y="160" width="460" height="230" rx="8" fill="#78350f" stroke="#d97706" stroke-width="1.5"/>
  
  <!-- The Water Tank Basin -->
  <rect x="130" y="195" width="380" height="160" rx="6" fill="url(#bathWater)" stroke="#a5f3fc" stroke-width="2" filter="url(#glow2)"/>
  
  <!-- North Steps -->
  <rect x="260" y="170" width="120" height="7" fill="#fed7aa"/>
  <rect x="265" y="177" width="110" height="6" fill="#fdba74"/>
  <rect x="270" y="183" width="100" height="6" fill="#fb923c"/>
  <rect x="275" y="189" width="90" height="6" fill="#f97316"/>
  <text x="320" y="166" fill="#ffedd5" font-size="11" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">North Flight of Steps</text>

  <!-- South Steps -->
  <rect x="260" y="378" width="120" height="7" fill="#fed7aa"/>
  <rect x="265" y="372" width="110" height="6" fill="#fdba74"/>
  <rect x="270" y="366" width="100" height="6" fill="#fb923c"/>
  <rect x="275" y="360" width="90" height="6" fill="#f97316"/>
  <text x="320" y="398" fill="#ffedd5" font-size="11" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">South Flight of Steps</text>

  <!-- Water Surface Ripple & Dimensions -->
  <text x="320" y="270" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle" filter="url(#glow2)">THE GREAT BATH</text>
  <text x="320" y="298" fill="#cffafe" font-size="14" font-family="system-ui, sans-serif" font-weight="500" text-anchor="middle">12m Length × 7m Width × 2.4m Depth</text>
  <text x="320" y="322" fill="#e0f2fe" font-size="12" font-family="system-ui, sans-serif" font-style="italic" text-anchor="middle">Natural Bitumen (Tar) Waterproofing between Brick Layers</text>

  <!-- Covered Drainage Canal Diagram in Lower Section -->
  <rect x="70" y="430" width="500" height="120" rx="14" fill="#061a13" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="90" y="458" fill="#4ade80" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">🛡️ Advanced Covered Drainage Network</text>
  <text x="90" y="482" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Bathrooms in every household connected by clay pipes to street drains</text>
  <text x="90" y="504" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Main street drains covered with removable flat limestone slabs for cleaning</text>
  <text x="90" y="526" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Soak-pits &amp; inspection sumps separated solid silt from flowing water</text>

  <!-- Right Educational Cards Panel -->
  <g transform="translate(620, 105)">
    <!-- Card 1: Grid Iron Planning -->
    <rect x="0" y="0" width="300" height="145" rx="16" fill="#112c20" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="32" fill="#fb923c" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">📐 Grid Town Planning</text>
    <text x="20" y="60" fill="#e2e8f0" font-size="13.5" font-family="system-ui, sans-serif">Streets aligned North-South &amp; East-West</text>
    <text x="20" y="82" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Wide boulevards up to 10 meters wide</text>
    <text x="20" y="104" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Right-angled rectangular blocks</text>
    <text x="20" y="126" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Rounded corners for easy cart turning</text>

    <!-- Card 2: Multistorey Brick Homes -->
    <rect x="0" y="160" width="300" height="145" rx="16" fill="#112c20" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="192" fill="#38bdf8" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">🏠 Two-Story Brick Houses</text>
    <text x="20" y="220" fill="#e2e8f0" font-size="13.5" font-family="system-ui, sans-serif">Built around private central courtyards</text>
    <text x="20" y="242" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Dedicated bathroom and private water wells</text>
    <text x="20" y="264" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Outer walls without front road windows</text>
    <text x="20" y="286" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Quiet, dust-free interior residential living</text>

    <!-- Card 3: Granaries & Storage -->
    <rect x="0" y="320" width="300" height="145" rx="16" fill="#112c20" stroke="#eab308" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="352" fill="#facc15" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">🌾 Great Granary (Harappa)</text>
    <text x="20" y="380" fill="#e2e8f0" font-size="13.5" font-family="system-ui, sans-serif">Massive food security storehouses</text>
    <text x="20" y="402" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Raised timber floors with air circulation ducts</text>
    <text x="20" y="424" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Prevented moisture and insect decay</text>
    <text x="20" y="446" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Circular brick platforms for threshing grain</text>
  </g>
</svg>
