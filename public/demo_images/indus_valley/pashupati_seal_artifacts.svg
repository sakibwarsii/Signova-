<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1811"/>
      <stop offset="50%" stop-color="#11291d"/>
      <stop offset="100%" stop-color="#08140e"/>
    </linearGradient>
    <linearGradient id="steatite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="sealGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg3)"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="880" height="64" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="65" y="65" fill="#fbbf24" font-size="26" font-family="system-ui, -apple-system, sans-serif" font-weight="bold">🦏 PASHUPATI SEAL &amp; ARTISTIC TREASURES</text>
  <text x="680" y="64" fill="#94a3b8" font-size="16" font-family="system-ui, -apple-system, sans-serif">Material Culture &amp; Craft</text>

  <!-- Left Artifact 1: The Steatite Pashupati Seal -->
  <g transform="translate(60, 115)">
    <!-- Seal Frame -->
    <rect x="0" y="0" width="240" height="240" rx="20" fill="url(#steatite)" stroke="#f59e0b" stroke-width="3" filter="url(#sealGlow)"/>
    <!-- Seal Inscription (Pictographic Script at Top) -->
    <rect x="25" y="20" width="190" height="35" rx="8" fill="#334155" opacity="0.85"/>
    <text x="120" y="44" fill="#f8fafc" font-size="17" font-family="monospace" font-weight="bold" text-anchor="middle" letter-spacing="4">𐤀 𐤇 𐤈 𐤏 𐤐</text>
    <text x="120" y="70" fill="#475569" font-size="10" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">INDUS SCRIPT (Undeciphered)</text>

    <!-- Seated Horned Deity (Pashupati / Proto-Shiva) -->
    <circle cx="120" cy="118" r="16" fill="#1e293b"/>
    <!-- Horned Headdress -->
    <path d="M 105 110 Q 90 90 85 80" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 135 110 Q 150 90 155 80" stroke="#0f172a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Seated Body in Yogic Posture (Cross-legged Padmasana) -->
    <path d="M 120 134 L 120 170" stroke="#1e293b" stroke-width="8"/>
    <path d="M 90 178 Q 120 185 150 178" stroke="#1e293b" stroke-width="8" stroke-linecap="round"/>
    <!-- Animals Around Deity -->
    <text x="45" y="115" fill="#0f172a" font-size="20">🐘</text>
    <text x="45" y="175" fill="#0f172a" font-size="20">🐅</text>
    <text x="175" y="115" fill="#0f172a" font-size="20">🦏</text>
    <text x="175" y="175" fill="#0f172a" font-size="20">🐃</text>
    <!-- Two Deer at bottom -->
    <text x="110" y="222" fill="#0f172a" font-size="14" text-anchor="middle">🦌🦌</text>

    <text x="120" y="265" fill="#fef08a" font-size="16" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Pashupati Seal (Mohenjo-daro)</text>
    <text x="120" y="285" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Carved Steatite Soft Stone (Lord of Beasts)</text>
  </g>

  <!-- Left Artifact 2: The Bronze Dancing Girl -->
  <g transform="translate(340, 115)">
    <rect x="0" y="0" width="220" height="240" rx="20" fill="#142c1f" stroke="#d97706" stroke-width="2"/>
    <!-- Bronze Statue Graphic -->
    <circle cx="110" cy="50" r="16" fill="url(#bronze)"/>
    <!-- Neck Ornaments -->
    <rect x="100" y="66" width="20" height="6" fill="#fef08a" rx="2"/>
    <!-- Slender Torso -->
    <path d="M 110 72 L 110 130" stroke="url(#bronze)" stroke-width="12" stroke-linecap="round"/>
    <!-- Left Hand Resting on Hip, Covered in Bangles -->
    <path d="M 104 88 L 80 120 L 102 135" stroke="url(#bronze)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Bangles Stack on Left Arm -->
    <circle cx="85" cy="115" r="7" stroke="#fde047" stroke-width="2" fill="none"/>
    <circle cx="89" cy="119" r="7" stroke="#fde047" stroke-width="2" fill="none"/>
    <!-- Right Arm Relaxed on Thigh -->
    <path d="M 116 88 L 132 125 L 122 155" stroke="url(#bronze)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Confident Standing Pose (Tribhanga posture) -->
    <path d="M 105 130 L 100 205" stroke="url(#bronze)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 115 130 L 125 205" stroke="url(#bronze)" stroke-width="7" stroke-linecap="round"/>

    <text x="110" y="265" fill="#fef08a" font-size="16" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Dancing Girl (Bronze)</text>
    <text x="110" y="285" fill="#94a3b8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle">Lost-wax Casting (Cire Perdue)</text>
  </g>

  <!-- Bottom Panel: Craftsmanship & Daily Life Highlights -->
  <g transform="translate(60, 425)">
    <rect x="0" y="0" width="500" height="135" rx="16" fill="#081b12" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.5"/>
    <text x="25" y="32" fill="#4ade80" font-size="16" font-family="system-ui, sans-serif" font-weight="bold">🏺 Standardized Crafts &amp; Pottery</text>
    <text x="25" y="58" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Red Ware with glossy black painted geometric &amp; animal motifs</text>
    <text x="25" y="80" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Carnelian beads with laser-precision drilled holes for export</text>
    <text x="25" y="102" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Binary and decimal weight systems (16, 64, 160 units) for trade</text>
  </g>

  <!-- Right Educational Cards Panel -->
  <g transform="translate(600, 105)">
    <!-- Card 1: The Seals of Indus -->
    <rect x="0" y="0" width="320" height="145" rx="16" fill="#132c20" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="32" fill="#fbbf24" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">🏷️ Commercial Seals</text>
    <text x="20" y="60" fill="#e2e8f0" font-size="13.5" font-family="system-ui, sans-serif">Over 3,500 seals discovered</text>
    <text x="20" y="82" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Pressed into wet clay on merchandise packs</text>
    <text x="20" y="104" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Unicorn, bull, elephant and tiger motifs</text>
    <text x="20" y="126" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Served as merchant logos and legal authority</text>

    <!-- Card 2: Lost-Wax Bronze Casting -->
    <rect x="0" y="160" width="320" height="145" rx="16" fill="#132c20" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="192" fill="#38bdf8" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">✨ Metallurgy Mastery</text>
    <text x="20" y="220" fill="#e2e8f0" font-size="13.5" font-family="system-ui, sans-serif">Advanced alloy chemistry</text>
    <text x="20" y="242" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Copper alloyed with tin to produce hard bronze</text>
    <text x="20" y="264" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Chisels, razors, fishhooks &amp; mirrors</text>
    <text x="20" y="286" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Peaceful culture: almost no military weapons found</text>

    <!-- Card 3: Peaceful Egalitarian Society -->
    <rect x="0" y="320" width="320" height="145" rx="16" fill="#132c20" stroke="#4ade80" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="20" y="352" fill="#4ade80" font-size="17" font-family="system-ui, sans-serif" font-weight="bold">🕊️ Society &amp; Daily Harmony</text>
    <text x="20" y="380" fill="#e2e8f0" font-size="13.5" font-family="system-ui, sans-serif">Remarkable civil coexistence</text>
    <text x="20" y="402" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• No palaces, royal tombs or warrior monuments</text>
    <text x="20" y="424" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• Standardized cleanliness and hygiene for all</text>
    <text x="20" y="446" fill="#cbd5e1" font-size="13" font-family="system-ui, sans-serif">• High literacy &amp; prosperous citizen middle class</text>
  </g>
</svg>
