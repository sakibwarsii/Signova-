<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#0b1329"/>
  
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#38bdf8" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">📈 SUPPLY &amp; DEMAND EQUILIBRIUM</text>
  <text x="540" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">Market Forces &amp; Price Determination</text>

  <!-- Graph Axes -->
  <line x1="180" y1="130" x2="180" y2="480" stroke="#94a3b8" stroke-width="4"/>
  <line x1="180" y1="480" x2="840" y2="480" stroke="#94a3b8" stroke-width="4"/>

  <!-- Axis Labels -->
  <text x="180" y="115" fill="#38bdf8" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Price ($)</text>
  <text x="850" y="520" fill="#38bdf8" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Quantity (Q)</text>

  <!-- Curves -->
  <!-- Demand Curve (Downward sloping from top-left to bottom-right) -->
  <line x1="240" y1="170" x2="760" y2="440" stroke="#f43f5e" stroke-width="6"/>
  <text x="780" y="445" fill="#f43f5e" font-size="26" font-family="system-ui, sans-serif" font-weight="bold">D (Demand)</text>

  <!-- Supply Curve (Upward sloping from bottom-left to top-right) -->
  <line x1="240" y1="440" x2="760" y2="170" stroke="#10b981" stroke-width="6"/>
  <text x="780" y="175" fill="#10b981" font-size="26" font-family="system-ui, sans-serif" font-weight="bold">S (Supply)</text>

  <!-- Equilibrium Intersection (500, 305) -->
  <circle cx="500" cy="305" r="12" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
  <line x1="180" y1="305" x2="500" y2="305" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="500" y1="305" x2="500" y2="480" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Equilibrium Label Callout -->
  <rect x="520" y="270" width="230" height="70" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
  <text x="635" y="300" fill="#fbbf24" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Equilibrium Point (E)</text>
  <text x="635" y="325" fill="#e2e8f0" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Market Clearing Price</text>

  <!-- Side summary card -->
  <rect x="220" y="515" width="560" height="55" rx="14" fill="#1e293b" stroke="#475569"/>
  <text x="500" y="550" fill="#e2e8f0" font-size="18" font-family="system-ui, sans-serif" text-anchor="middle">When Supply equals Demand, market price stabilizes.</text>
</svg>