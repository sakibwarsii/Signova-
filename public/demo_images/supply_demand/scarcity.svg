<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#0b1329"/>
  
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#ec4899" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">🍪 SCARCITY IN THE MARKETPLACE</text>
  <text x="540" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">When Wants Exceed Available Resources</text>

  <!-- Visual Comparison -->
  <rect x="70" y="130" width="820" height="340" rx="24" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  
  <g transform="translate(120, 180)">
    <rect x="0" y="0" width="320" height="240" rx="16" fill="#831843" fill-opacity="0.3" stroke="#f472b6"/>
    <text x="160" y="50" fill="#f472b6" font-size="24" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">LOW SUPPLY</text>
    <text x="160" y="120" fill="#ffffff" font-size="48" font-family="system-ui, sans-serif" text-anchor="middle">🍪 🍪</text>
    <text x="160" y="180" fill="#fbcfe8" font-size="18" font-family="system-ui, sans-serif" text-anchor="middle">Only 2 Cookies Available</text>
    <text x="160" y="210" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Limited production</text>
  </g>

  <g transform="translate(520, 180)">
    <rect x="0" y="0" width="320" height="240" rx="16" fill="#1e3a8a" fill-opacity="0.3" stroke="#60a5fa"/>
    <text x="160" y="50" fill="#60a5fa" font-size="24" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">HIGH DEMAND</text>
    <text x="160" y="120" fill="#ffffff" font-size="44" font-family="system-ui, sans-serif" text-anchor="middle">🙋 🙋 🙋 🙋 🙋</text>
    <text x="160" y="180" fill="#bfdbfe" font-size="18" font-family="system-ui, sans-serif" text-anchor="middle">10 Friends Want To Buy</text>
    <text x="160" y="210" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Eager buyers competing</text>
  </g>

  <rect x="180" y="500" width="600" height="60" rx="14" fill="#ec4899"/>
  <text x="480" y="538" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">➔ Price Increases Because Cookies are Scarce!</text>
</svg>