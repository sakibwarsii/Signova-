<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#0b1329"/>
  
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#f59e0b" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">🏷️ PRICE ELASTICITY &amp; DEMAND</text>
  <text x="540" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">How Buyers Respond to Price Changes</text>

  <!-- Box 1: Price Drops -->
  <rect x="70" y="130" width="390" height="420" rx="24" fill="#1e293b" stroke="#10b981" stroke-width="3"/>
  <text x="265" y="180" fill="#10b981" font-size="28" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">PRICE DROPS ⬇️</text>
  
  <rect x="100" y="210" width="330" height="80" rx="14" fill="#064e3b" fill-opacity="0.5"/>
  <text x="265" y="245" fill="#6ee7b7" font-size="20" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Higher Supply + Low Demand</text>
  <text x="265" y="275" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Sellers discount goods to sell fast</text>

  <text x="120" y="340" fill="#e2e8f0" font-size="20" font-family="system-ui, sans-serif">➔ Result: Demand Rises ⬆️</text>
  <text x="120" y="380" fill="#94a3b8" font-size="16" font-family="system-ui, sans-serif">Lower prices attract more buyers to</text>
  <text x="120" y="410" fill="#94a3b8" font-size="16" font-family="system-ui, sans-serif">purchase larger quantities.</text>

  <rect x="100" y="460" width="330" height="60" rx="14" fill="#10b981"/>
  <text x="265" y="498" fill="#064e3b" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">More Buyers Purchase</text>

  <!-- Box 2: Price Rises -->
  <rect x="500" y="130" width="390" height="420" rx="24" fill="#1e293b" stroke="#f43f5e" stroke-width="3"/>
  <text x="695" y="180" fill="#f43f5e" font-size="28" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">PRICE RISES ⬆️</text>

  <rect x="530" y="210" width="330" height="80" rx="14" fill="#450a0a" fill-opacity="0.5"/>
  <text x="695" y="245" fill="#fca5a5" font-size="20" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Low Supply + High Demand</text>
  <text x="695" y="275" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Goods are scarce and competitive</text>

  <text x="550" y="340" fill="#e2e8f0" font-size="20" font-family="system-ui, sans-serif">➔ Result: Demand Drops ⬇️</text>
  <text x="550" y="380" fill="#94a3b8" font-size="16" font-family="system-ui, sans-serif">Higher prices deter casual buyers,</text>
  <text x="550" y="410" fill="#94a3b8" font-size="16" font-family="system-ui, sans-serif">slowing down transaction volume.</text>

  <rect x="530" y="460" width="330" height="60" rx="14" fill="#f43f5e"/>
  <text x="695" y="498" fill="#450a0a" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Fewer Buyers Purchase</text>
</svg>