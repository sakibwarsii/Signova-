<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <!-- Background chalkboard gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082015" />
      <stop offset="50%" stop-color="#0b281b" />
      <stop offset="100%" stop-color="#05170e" />
    </linearGradient>
    
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Chalkboard Background -->
  <rect width="960" height="600" fill="url(#bgGrad)" />
  
  <!-- Subtle Chalk Grid -->
  <g opacity="0.08" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="300" x2="960" y2="300" />
    <line x1="0" y1="400" x2="960" y2="400" />
    <line x1="0" y1="500" x2="960" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
  </g>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="930" height="570" rx="16" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" />

  <!-- Header Section -->
  <g transform="translate(45, 55)">

    <!-- Category / Feature badge if any -->
    
      <rect x="0" y="-22" width="130" height="30" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="65" y="-2" fill="#f1f5f9" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Day Phase</text>
    

    <!-- Slide Title -->
    <text x="0" y="32" fill="#ffffff" font-size="28" font-weight="bold" font-family="sans-serif">Stage 1: Light-Dependent Reactions</text>
    <!-- Subtitle -->
    <text x="0" y="56" fill="#6ee7b7" font-size="16" font-family="sans-serif">Harvesting Solar Electricity</text>
  </g>

  <!-- Center Pedagogical Illustration -->
  
      <g transform="translate(480, 310)">
        <!-- Sun with rays -->
        <circle cx="-240" cy="-90" r="45" fill="#f59e0b" opacity="0.9" />
        <circle cx="-240" cy="-90" r="58" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,6" />
        <!-- Photon Energy Beams -->
        <path d="M -180 -70 L -40 20" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,8" />
        <text x="-120" y="-35" fill="#fef08a" font-size="14" font-weight="bold" font-family="sans-serif">Sunlight Photons (hν)</text>
        
        <!-- Big Green Leaf / Plant Cell -->
        <path d="M -80 60 C -120 -60, 60 -110, 160 0 C 160 70, 40 110, -80 60 Z" fill="url(#leafGrad)" stroke="#34d399" stroke-width="4" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))" />
        <path d="M -70 50 Q 30 0 150 0" stroke="#a7f3d0" stroke-width="3" fill="none" />
        <path d="M -20 25 L -40 50" stroke="#a7f3d0" stroke-width="2" />
        <path d="M 20 10 L 20 40" stroke="#a7f3d0" stroke-width="2" />
        <path d="M 60 5 L 80 30" stroke="#a7f3d0" stroke-width="2" />
        <path d="M 100 -2 L 120 15" stroke="#a7f3d0" stroke-width="2" />

        <!-- Chemical Inputs & Outputs -->
        <rect x="-260" y="30" width="130" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
        <text x="-195" y="56" fill="#7dd3fc" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">6 CO₂ (Air)</text>
        <path d="M -125 51 L -75 51" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />

        <rect x="-260" y="90" width="130" height="42" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2" />
        <text x="-195" y="116" fill="#93c5fd" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">6 H₂O (Roots)</text>
        <path d="M -125 111 L -65 80" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)" />

        <!-- Products -->
        <rect x="180" y="-30" width="150" height="42" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2" />
        <text x="255" y="-4" fill="#6ee7b7" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">C₆H₁₂O₆ (Glucose)</text>
        <path d="M 155 0 L 175 -9" stroke="#34d399" stroke-width="3" />

        <rect x="180" y="30" width="150" height="42" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2" />
        <text x="255" y="56" fill="#fbcfe8" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">6 O₂ (Fresh Air)</text>
        <path d="M 155 10 L 175 45" stroke="#f472b6" stroke-width="3" />
      </g>
    

  <!-- Lower Takeaway & Bullets Box -->
  <rect x="45" y="445" width="870" height="115" rx="14" fill="#061f14" stroke="#059669" stroke-width="1.5" opacity="0.9" />
  
    <g transform="translate(80, 475)">
      <circle cx="0" cy="-5" r="4" fill="#f59e0b" />
      <text x="14" y="0" fill="#e2e8f0" font-size="15" font-family="sans-serif">Occurs in the thylakoid membrane discs during daytime</text>
    </g>
  
    <g transform="translate(80, 503)">
      <circle cx="0" cy="-5" r="4" fill="#f59e0b" />
      <text x="14" y="0" fill="#e2e8f0" font-size="15" font-family="sans-serif">Sunlight strikes Photosystem II, charging up electrons</text>
    </g>
  
    <g transform="translate(80, 531)">
      <circle cx="0" cy="-5" r="4" fill="#f59e0b" />
      <text x="14" y="0" fill="#e2e8f0" font-size="15" font-family="sans-serif">Generates ATP (chemical fuel) and NADPH (energy carriers)</text>
    </g>
  

  <!-- Analogy / Formula pill in bottom right -->
  
</svg>