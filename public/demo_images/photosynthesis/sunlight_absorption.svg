<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#052e16"/>
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#4ade80" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">☀️ SOLAR ENERGY ABSORPTION IN LEAVES</text>
  <text x="560" y="70" fill="#86efac" font-size="18" font-family="system-ui, sans-serif">Light photons absorbed by Chlorophyll</text>

  <!-- Sun -->
  <circle cx="180" cy="220" r="65" fill="#fbbf24"/>
  <circle cx="180" cy="220" r="85" fill="#fbbf24" opacity="0.25"/>

  <!-- Sun Rays hitting Leaf -->
  <line x1="250" y1="240" x2="480" y2="330" stroke="#fde047" stroke-width="6" stroke-dasharray="12,6"/>
  <line x1="250" y1="270" x2="520" y2="380" stroke="#fde047" stroke-width="6" stroke-dasharray="12,6"/>
  <line x1="220" y1="300" x2="450" y2="420" stroke="#fde047" stroke-width="6" stroke-dasharray="12,6"/>

  <!-- Leaf Structure Cross Section -->
  <path d="M 420 300 C 580 200 800 280 840 400 C 700 500 500 480 420 300 Z" fill="#15803d" stroke="#22c55e" stroke-width="6"/>

  <!-- Leaf Veins -->
  <path d="M 430 310 Q 640 370 820 400" fill="none" stroke="#86efac" stroke-width="5"/>
  <path d="M 520 340 Q 560 270 600 240" fill="none" stroke="#86efac" stroke-width="3"/>
  <path d="M 640 375 Q 690 310 740 280" fill="none" stroke="#86efac" stroke-width="3"/>
  <path d="M 560 355 Q 600 430 640 460" fill="none" stroke="#86efac" stroke-width="3"/>

  <!-- Key Concept Box -->
  <rect x="520" y="420" width="380" height="130" rx="18" fill="#0f172a" fill-opacity="0.92" stroke="#4ade80" stroke-width="2"/>
  <text x="710" y="460" fill="#4ade80" font-size="20" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Energy Conversion</text>
  <text x="710" y="495" fill="#f8fafc" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Light Energy ➔ Chemical Energy (Glucose)</text>
  <text x="710" y="525" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Chloroplasts trap photons to split water molecules</text>
</svg>