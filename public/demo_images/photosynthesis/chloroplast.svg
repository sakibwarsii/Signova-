<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#0a151b"/>
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#4ade80" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">🍃 CHLOROPLAST &amp; CHLOROPHYLL</text>
  <text x="560" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">The Solar Factory of Plant Cells</text>

  <!-- Chloroplast Body -->
  <ellipse cx="480" cy="340" rx="340" ry="190" fill="#15803d" stroke="#22c55e" stroke-width="5"/>
  <ellipse cx="480" cy="340" rx="310" ry="165" fill="#166534" stroke="#86efac" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Thylakoids (Stacks) -->
  <g transform="translate(260, 260)">
    <ellipse cx="60" cy="40" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="60" cy="65" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="60" cy="90" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <text x="60" y="140" fill="#bbf7d0" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Thylakoid Stack</text>
  </g>

  <g transform="translate(420, 270)">
    <ellipse cx="60" cy="40" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="60" cy="65" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="60" cy="90" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <text x="60" y="140" fill="#bbf7d0" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Granum (Stack)</text>
  </g>

  <g transform="translate(580, 260)">
    <ellipse cx="60" cy="40" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="60" cy="65" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <ellipse cx="60" cy="90" rx="55" ry="18" fill="#4ade80" stroke="#15803d" stroke-width="2"/>
    <text x="60" y="140" fill="#bbf7d0" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Light Reaction</text>
  </g>

  <!-- Labels -->
  <rect x="70" y="130" width="240" height="65" rx="12" fill="#000000" fill-opacity="0.6" stroke="#4ade80"/>
  <text x="190" y="160" fill="#4ade80" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Outer Membrane</text>
  <text x="190" y="182" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Protective double layer</text>

  <rect x="650" y="130" width="240" height="65" rx="12" fill="#000000" fill-opacity="0.6" stroke="#4ade80"/>
  <text x="770" y="160" fill="#86efac" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Stroma Fluid</text>
  <text x="770" y="182" fill="#cbd5e1" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Dark reaction / Sugar synth</text>
</svg>