<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="100%" height="100%">
  <defs>
    <!-- Background chalkboard gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082015" />
      <stop offset="50%" stop-color="#0b281b" />
      <stop offset="100%" stop-color="#05170e" />
    </linearGradient>
    
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="60%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Chalkboard Background -->
  <rect width="960" height="600" fill="url(#bgGrad)" />
  
  <!-- Subtle Chalk Grid -->
  <g opacity="0.08" stroke="#34d399" stroke-width="1">
    <line x1="0" y1="100" x2="960" y2="100" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="0" y1="300" x2="960" y2="300" />
    <line x1="0" y1="400" x2="960" y2="400" />
    <line x1="0" y1="500" x2="960" y2="500" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
    <line x1="800" y1="0" x2="800" y2="600" />
  </g>

  <!-- Outer Frame -->
  <rect x="15" y="15" width="930" height="570" rx="16" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" />

  <!-- Header Section -->
  <g transform="translate(45, 55)">

    <!-- Category / Feature badge if any -->
    

    <!-- Slide Title -->
    <text x="0" y="32" fill="#ffffff" font-size="28" font-weight="bold" font-family="sans-serif">Cost Price (CP): The Purchase Expense</text>
    <!-- Subtitle -->
    <text x="0" y="56" fill="#6ee7b7" font-size="16" font-family="sans-serif">What the Merchant Spends</text>
  </g>

  <!-- Center Pedagogical Illustration -->
  
      <g transform="translate(480, 310)">
        <!-- Merchant Storefront / Balance Scales -->
        <!-- Cost Price Box -->
        <rect x="-240" y="-60" width="180" height="150" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="3" />
        <text x="-150" y="-25" fill="#94a3b8" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Cost Price (CP)</text>
        <text x="-150" y="15" fill="#f1f5f9" font-size="32" font-weight="bold" text-anchor="middle" font-family="sans-serif">₹ 40</text>
        <text x="-150" y="45" fill="#cbd5e1" font-size="13" text-anchor="middle" font-family="sans-serif">Wholesale Purchase</text>
        <text x="-150" y="65" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">+ ₹4 Transport Fee</text>

        <!-- VS Circle -->
        <circle cx="0" cy="15" r="28" fill="#334155" stroke="#94a3b8" stroke-width="2" />
        <text x="0" y="21" fill="#f8fafc" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">VS</text>

        <!-- Selling Price Box -->
        <rect x="60" y="-60" width="180" height="150" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="3" />
        <text x="150" y="-25" fill="#6ee7b7" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Selling Price (SP)</text>
        <text x="150" y="15" fill="#ecfdf5" font-size="32" font-weight="bold" text-anchor="middle" font-family="sans-serif">₹ 50</text>
        <text x="150" y="45" fill="#a7f3d0" font-size="13" text-anchor="middle" font-family="sans-serif">Customer Retail Price</text>
        <text x="150" y="65" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">SP &gt; CP (GAIN!)</text>

        <!-- Bottom Profit Banner -->
        <rect x="-140" y="115" width="280" height="42" rx="12" fill="#10b981" filter="drop-shadow(0 4px 10px rgba(16,185,129,0.3))" />
        <text x="0" y="142" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="sans-serif">Net Profit = ₹10 (+25% Margin)</text>
      </g>
    

  <!-- Lower Takeaway & Bullets Box -->
  <rect x="45" y="445" width="870" height="115" rx="14" fill="#061f14" stroke="#059669" stroke-width="1.5" opacity="0.9" />
  
    <g transform="translate(80, 475)">
      <circle cx="0" cy="-5" r="4" fill="#64748b" />
      <text x="14" y="0" fill="#e2e8f0" font-size="15" font-family="sans-serif">The exact price paid by the seller to acquire the product</text>
    </g>
  
    <g transform="translate(80, 503)">
      <circle cx="0" cy="-5" r="4" fill="#64748b" />
      <text x="14" y="0" fill="#e2e8f0" font-size="15" font-family="sans-serif">Includes manufacturer price or wholesale purchase cost</text>
    </g>
  
    <g transform="translate(80, 531)">
      <circle cx="0" cy="-5" r="4" fill="#64748b" />
      <text x="14" y="0" fill="#e2e8f0" font-size="15" font-family="sans-serif">Denoted by the symbol CP</text>
    </g>
  

  <!-- Analogy / Formula pill in bottom right -->
  
    <g transform="translate(680, 480)">
      <rect x="0" y="0" width="215" height="36" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" />
      <text x="107" y="23" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Symbol: CP</text>
    </g>
  
</svg>