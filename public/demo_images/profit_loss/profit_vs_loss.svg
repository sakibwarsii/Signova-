<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#0f172a"/>
  
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#fbbf24" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">⚖️ PROFIT vs LOSS FORMULAS</text>
  <text x="560" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">Comparing Selling Price &amp; Cost Price</text>

  <!-- Left: Profit Box -->
  <rect x="70" y="130" width="390" height="420" rx="24" fill="#064e3b" fill-opacity="0.3" stroke="#22c55e" stroke-width="3"/>
  <text x="265" y="180" fill="#4ade80" font-size="32" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">PROFIT (GAIN)</text>
  <text x="265" y="215" fill="#86efac" font-size="18" font-family="system-ui, sans-serif" text-anchor="middle">When Selling Price &gt; Cost Price</text>

  <rect x="100" y="250" width="330" height="70" rx="14" fill="#052e16" stroke="#4ade80"/>
  <text x="265" y="295" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Profit = SP − CP</text>

  <text x="110" y="360" fill="#cbd5e1" font-size="18" font-family="system-ui, sans-serif">• Bought for (CP) = $8.00</text>
  <text x="110" y="400" fill="#cbd5e1" font-size="18" font-family="system-ui, sans-serif">• Sold for (SP) = $12.00</text>
  <text x="110" y="440" fill="#cbd5e1" font-size="18" font-family="system-ui, sans-serif">• Difference = $12 − $8</text>
  
  <rect x="100" y="470" width="330" height="60" rx="14" fill="#22c55e"/>
  <text x="265" y="508" fill="#052e16" font-size="24" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">PROFIT = +$4.00 🎉</text>

  <!-- Right: Loss Box -->
  <rect x="500" y="130" width="390" height="420" rx="24" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="3"/>
  <text x="695" y="180" fill="#f87171" font-size="32" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">LOSS</text>
  <text x="695" y="215" fill="#fca5a5" font-size="18" font-family="system-ui, sans-serif" text-anchor="middle">When Selling Price &lt; Cost Price</text>

  <rect x="530" y="250" width="330" height="70" rx="14" fill="#450a0a" stroke="#f87171"/>
  <text x="695" y="295" fill="#ffffff" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Loss = CP − SP</text>

  <text x="540" y="360" fill="#cbd5e1" font-size="18" font-family="system-ui, sans-serif">• Bought for (CP) = $8.00</text>
  <text x="540" y="400" fill="#cbd5e1" font-size="18" font-family="system-ui, sans-serif">• Sold for (SP) = $6.00</text>
  <text x="540" y="440" fill="#cbd5e1" font-size="18" font-family="system-ui, sans-serif">• Difference = $8 − $6</text>

  <rect x="530" y="470" width="330" height="60" rx="14" fill="#ef4444"/>
  <text x="695" y="508" fill="#ffffff" font-size="24" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">LOSS = −$2.00 📉</text>
</svg>