<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#082f49"/>
  <circle cx="800" cy="120" r="70" fill="#fbbf24" opacity="0.8"/>
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#38bdf8" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">🐦 THE THIRSTY CROW: SUCCESS!</text>
  <text x="560" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">Water rises to the top — thirst quenched!</text>

  <!-- Pitcher with High Water -->
  <path d="M 240 480 C 220 400 240 320 280 290 L 300 290 L 300 240 L 260 220 L 340 220 L 300 240 L 300 290 L 320 290 C 360 320 380 400 360 480 Z" fill="#b45309" stroke="#78350f" stroke-width="6"/>
  <!-- High Water Level -->
  <path d="M 285 270 Q 300 260 315 270 C 330 300 340 350 330 460 L 270 460 C 260 350 270 300 285 270 Z" fill="#38bdf8" opacity="0.85"/>

  <!-- Flying Crow -->
  <ellipse cx="620" cy="240" rx="60" ry="35" fill="#1e293b"/>
  <circle cx="670" cy="215" r="22" fill="#1e293b"/>
  <polygon points="690,215 720,222 690,228" fill="#fbbf24"/>
  <circle cx="680" cy="210" r="4" fill="#ffffff"/>
  <!-- Spread Wings -->
  <path d="M 600 220 C 580 150 660 140 680 190 Z" fill="#0f172a"/>
  <path d="M 570 240 C 530 180 590 170 620 225 Z" fill="#334155"/>

  <!-- Moral / Key Lesson Box -->
  <rect x="420" y="380" width="460" height="130" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
  <text x="650" y="425" fill="#fbbf24" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Moral of the Story</text>
  <text x="650" y="460" fill="#f8fafc" font-size="18" font-family="system-ui, sans-serif" text-anchor="middle">Where there is a will, there is a way!</text>
  <text x="650" y="488" fill="#94a3b8" font-size="15" font-family="system-ui, sans-serif" text-anchor="middle">Patience and intelligence overcome any difficulty.</text>
</svg>