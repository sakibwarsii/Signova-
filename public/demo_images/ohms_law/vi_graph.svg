<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#0c101c"/>
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#38bdf8" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">📈 VOLTAGE VS CURRENT GRAPH (V-I)</text>
  <text x="600" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">Linear Ohmic Conductor</text>

  <!-- Graph Axes -->
  <line x1="200" y1="480" x2="800" y2="480" stroke="#94a3b8" stroke-width="4"/>
  <line x1="200" y1="480" x2="200" y2="160" stroke="#94a3b8" stroke-width="4"/>
  
  <text x="820" y="485" fill="#4ade80" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Current (I) ➔</text>
  <text x="140" y="160" fill="#fbbf24" font-size="18" font-family="system-ui, sans-serif" font-weight="bold">Voltage (V) ⬆</text>

  <!-- Grid Lines -->
  <line x1="350" y1="480" x2="350" y2="160" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="500" y1="480" x2="500" y2="160" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="650" y1="480" x2="650" y2="160" stroke="#334155" stroke-dasharray="4,4"/>

  <line x1="200" y1="400" x2="800" y2="400" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="200" y1="320" x2="800" y2="320" stroke="#334155" stroke-dasharray="4,4"/>
  <line x1="200" y1="240" x2="800" y2="240" stroke="#334155" stroke-dasharray="4,4"/>

  <!-- Linear Slope Line -->
  <line x1="200" y1="480" x2="720" y2="200" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="373" cy="387" r="8" fill="#fbbf24"/>
  <circle cx="546" cy="293" r="8" fill="#fbbf24"/>
  <circle cx="720" cy="200" r="8" fill="#fbbf24"/>

  <!-- Slope Info -->
  <rect x="520" y="340" width="280" height="90" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2"/>
  <text x="660" y="375" fill="#38bdf8" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Slope = Resistance (R)</text>
  <text x="660" y="405" fill="#cbd5e1" font-size="15" font-family="system-ui, sans-serif" text-anchor="middle">Constant slope = Constant R</text>
</svg>