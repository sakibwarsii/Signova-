<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#0c101c"/>
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#38bdf8" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">⚡ SIMPLE ELECTRIC CIRCUIT</text>
  <text x="560" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">Current flow from Voltage through Resistor</text>

  <!-- Circuit Loop -->
  <rect x="200" y="160" width="560" height="320" rx="24" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="16,8"/>

  <!-- Battery Source (Left) -->
  <circle cx="200" cy="320" r="45" fill="#1e293b" stroke="#fbbf24" stroke-width="4"/>
  <text x="200" y="315" fill="#fbbf24" font-size="24" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">+  -</text>
  <text x="200" y="345" fill="#fde68a" font-size="16" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Battery (V)</text>

  <!-- Resistor (Top) -->
  <rect x="420" y="135" width="120" height="50" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="4"/>
  <path d="M 430 160 L 445 145 L 460 175 L 475 145 L 490 175 L 505 145 L 520 175 L 530 160" fill="none" stroke="#f43f5e" stroke-width="4"/>
  <text x="480" y="215" fill="#fca5a5" font-size="18" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Resistor (R)</text>

  <!-- Current Arrow (Right) -->
  <circle cx="760" cy="320" r="45" fill="#1e293b" stroke="#4ade80" stroke-width="4"/>
  <text x="760" y="315" fill="#4ade80" font-size="28" font-family="system-ui, sans-serif" text-anchor="middle">➔</text>
  <text x="760" y="345" fill="#86efac" font-size="16" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Current (I)</text>

  <!-- Explanation Cards -->
  <rect x="250" y="250" width="460" height="140" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="480" y="295" fill="#38bdf8" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Core Rule: V = I × R</text>
  <text x="480" y="335" fill="#e2e8f0" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">• Increasing Voltage increases Current flow</text>
  <text x="480" y="365" fill="#e2e8f0" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">• Increasing Resistance reduces Current flow</text>
</svg>