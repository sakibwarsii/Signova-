<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <rect width="960" height="600" fill="#0c101c"/>
  
  <rect x="40" y="30" width="880" height="60" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
  <text x="70" y="70" fill="#38bdf8" font-size="28" font-family="system-ui, sans-serif" font-weight="bold">⚡ OHM'S LAW EQUATION</text>
  <text x="560" y="70" fill="#94a3b8" font-size="18" font-family="system-ui, sans-serif">Voltage = Current × Resistance</text>

  <!-- Big Triangle Container -->
  <polygon points="480,120 220,480 740,480" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Divider Lines -->
  <line x1="330" y1="330" x2="630" y2="330" stroke="#38bdf8" stroke-width="4"/>
  <line x1="480" y1="330" x2="480" y2="480" stroke="#38bdf8" stroke-width="4"/>

  <!-- Letters in Triangle -->
  <text x="480" y="270" fill="#fbbf24" font-size="80" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">V</text>
  <text x="360" y="430" fill="#4ade80" font-size="70" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">I</text>
  <text x="600" y="430" fill="#f43f5e" font-size="70" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">R</text>

  <!-- Explanations Beside -->
  <rect x="60" y="150" width="180" height="110" rx="16" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="2"/>
  <text x="150" y="195" fill="#fde68a" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Voltage (V)</text>
  <text x="150" y="225" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Push / Potential</text>
  <text x="150" y="248" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Units: Volts (V)</text>

  <rect x="60" y="340" width="180" height="110" rx="16" fill="#4ade80" fill-opacity="0.1" stroke="#4ade80" stroke-width="2"/>
  <text x="150" y="385" fill="#86efac" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Current (I)</text>
  <text x="150" y="415" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Flow of charge</text>
  <text x="150" y="438" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Units: Amperes (A)</text>

  <rect x="720" y="340" width="180" height="110" rx="16" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-width="2"/>
  <text x="810" y="385" fill="#fca5a5" font-size="22" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">Resistance (R)</text>
  <text x="810" y="415" fill="#ffffff" font-size="16" font-family="system-ui, sans-serif" text-anchor="middle">Opposition to flow</text>
  <text x="810" y="438" fill="#94a3b8" font-size="14" font-family="system-ui, sans-serif" text-anchor="middle">Units: Ohms (Ω)</text>

  <!-- Formula Summary -->
  <rect x="220" y="515" width="520" height="55" rx="14" fill="#0f172a" stroke="#475569"/>
  <text x="480" y="550" fill="#e2e8f0" font-size="20" font-family="system-ui, sans-serif" font-weight="bold" text-anchor="middle">V = I × R  |  I = V / R  |  R = V / I</text>
</svg>